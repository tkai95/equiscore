<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" role="img" aria-label="Tier C monogram">
  <defs>
    <linearGradient id="metal-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B1892D"/>
      <stop offset="45%" stop-color="#E4C676"/>
      <stop offset="100%" stop-color="#B1892D"/>
    </linearGradient>
    <filter id="shadow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="emboss-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.35" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.5" specularExponent="18" lighting-color="#ffffff" result="spec">
        <fePointLight x="18" y="10" z="26"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"/>
      <feComposite in="SourceGraphic" in2="spec2" operator="arithmetic" k1="0" k2="1" k3="0.7" k4="0"/>
    </filter>
  </defs>

  <path d="M 18 58 A 34 34 0 0 1 82 58" fill="none" stroke="url(#metal-c)" stroke-width="2.6" stroke-linecap="round" filter="url(#shadow-c)"/>

  <g filter="url(#emboss-c)">
    <text x="50" y="64" text-anchor="middle"
          font-family="Cormorant Garamond, EB Garamond, Garamond, Baskerville, 'Times New Roman', serif"
          font-size="34" font-weight="600" letter-spacing="0.5"
          fill="url(#metal-c)">C</text>
  </g>
</svg>
