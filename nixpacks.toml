# Railway/Nixpacks sets NODE_ENV=production during install, so plain `npm ci`
# skips devDependencies. The API build needs @nestjs/cli, typescript, ts-loader,
# and workspace packages need prisma (dev) for `prisma generate`.
[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "npx prisma generate --schema=packages/database/prisma/schema.prisma",
  "npx turbo build --filter=@equiscore/api",
]
